<!DOCTYPE html>
<html lang="en">
   <head>
    <meta charset="UTF-8" />
    <title>My little calculator</title>
    <link rel="stylesheet" href="style.css" />
   </head>
  <body>
    <input type="text" id="number"/>
    <h2 id="info" class="big" title="Info about the number">
        Information about the number
    </h2>
    <button onclick="appendNumber('1')">1</button>
    <button onclick="appendNumber('2')">2</button>
    <button onclick="appendNumber('3')">3</button>
    <button onclick="appendNumber('4')">4</button>
    <button onclick="appendNumber('5')">5</button>
    <button onclick="appendNumber('6')">6</button>
    <button onclick="appendNumber('7')">7</button>
    <button onclick="appendNumber('8')">8</button>
    <button onclick="appendNumber('9')">9</button>
    <button onclick="appendNumber('0')">0</button>
    <button onclick="appendNumber(',')">,</button>
    <button onclick="appendNumber('.')">.</button>
    <button onclick="appendNumber('-')">-</button>
    <button id="addition" onclick="addition()">+</button>
    <button id="multiplication" onclick="multiplication()">x</button>
    <button onclick="divide()">/</button>
    <button id="equal" onclick="eq()">=</button>
    <button id="modulo" onclick="mod()">mod()</button>
    <button id="factorial" onclick="fact()">fact()</button>
    <button onclick="squareRoot()">√</button>
    <button id="square" onclick="square()">²</button>
    <button onclick="exponentiation()">x²</button>
    <button id="sum" onclick="sum()">sum()</button>
    <button onclick="sort()">sort()</button>
    <button onclick="reverse()">reverse()</button>
    <button onclick="removelast()">removelast()</button>
    <script type="text/javascript">
    let first_number ;
    let operator ;
     function appendNumber(num) {
            let inputField = document.getElementById("number");
            inputField.value = inputField.value + num;
        }

     function fill_info() {
            let inputField = document.getElementById("number");
            let infoField = document.getElementById("info");
            let result = +inputField.value;

            if (result < 100) {
                infoField.innerHTML = "Info: The result is less than 100";
            } else if (result >= 100 && result <= 200) {
                infoField.innerHTML = "Info: The result is between 100 and 200";
            } else {
                infoField.innerHTML = "Info: The result is greater than 200";
            }
        }
     function square() {
            let inputField = document.getElementById("number");
            let result = +inputField.value;
            inputField.value = result * result;
            fill_info();
        }
    function squareRoot() {
            let inputField = document.getElementById("number");
            let result = +inputField.value;
                if (result < 0) {
                    inputField.value = "Error: Square root of negative number is undefined";
                } else {
                    inputField.value = Math.sqrt(result);
                }
                fill_info();
        }
    function mod() {
            let inputField = document.getElementById("number");
            let result = +inputField.value;
            if (result < 0) {
               result = -result;
            }
            inputField.value = result;
            fill_info();
        }
    function fact() {
            let inputField = document.getElementById("number");
            let x = +inputField.value;
            if (x < 0) {
                inputField.value = "Error: Factorial of negative number is undefined";
            } else {
                let factorial = 1;
                for (let i = 1; i <= x; i++) {
                    factorial *= i;
                }
                inputField.value = factorial;
            }
            fill_info();
        }
    function multiplication() {
            let inputField = document.getElementById("number");
            first_number = +inputField.value;
            operator = "multiplication";
            inputField.value = "";
        }
    function divide() {
            let inputField = document.getElementById("number");
            first_number = +inputField.value;
            operator = "divide";
            inputField.value = "";
        }
    function eq() {
            let inputField = document.getElementById("number");
            let second_number = +inputField.value;
            let result;
            if (operator === "addition") {
                result = first_number + second_number;
            } else if (operator === "divide") {
                result = first_number / second_number;
            } else if (operator === "multiplication") {
                result = first_number * second_number;
            }
            inputField.value = result;
            fill_info();
        }
    function exponentiation() {
            let inputField = document.getElementById("number");
            let x = +inputField.value;
            inputField.value = x ** 2;
            fill_info();
        }
    function sum() {
            let inputField = document.getElementById("number");
            let arr = inputField.value.split(",");
            let total = 0;
            for (let i = 0; i < arr.length; i++) {
            total = total + +arr[i];
            }
            inputField.value = total;
            fill_info();
        }
    function sort() {
            let inputField = document.getElementById("number");
            let arr = inputField.value.split(",");
            arr.sort() ;
            inputField.value = arr.join(",");
        }
    function reverse() {
            let inputField = document.getElementById("number");
            let arr = inputField.value.split(",");
            arr.reverse();
            inputField.value = arr.join(",");
        }
    function removelast() {
            let inputField = document.getElementById("number");
            let arr = inputField.value.split(",");
            arr.pop();
            inputField.value = arr.join(",");
        }
    function addition() {
            let inputField = document.getElementById("number");
            first_number = +inputField.value;
            operator = "addition";
            inputField.value = "";
        }
    function validate
    </script>
</body>
</html>
